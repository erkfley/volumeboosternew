name: Build Debug APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Print AndroidX dependency versions
        run: ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon | grep -E "androidx.activity|androidx.core|androidx.lifecycle"
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
