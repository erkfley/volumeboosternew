plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.hermes.volumebooster'
    compileSdk 35

    defaultConfig {
        applicationId "com.hermes.volumebooster"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Required so the Gradle wrapper resolves correctly in CI
        vectorDrawables {
            useSupportLibrary = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // Compose BOM MUST be declared first so its version constraints apply
    implementation platform('androidx.compose:compose-bom:2024.09.00')

    // AndroidX (versions managed by BOM)
    implementation 'androidx.core:core-ktx'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx'
    implementation 'androidx.activity:activity-compose'

    // Jetpack Compose (BOM manages versions)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Material Components provides XML theme styles (Theme.Material3.DayNight.NoActionBar)
    implementation 'com.google.android.material:material:1.12.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-junit4'

    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
